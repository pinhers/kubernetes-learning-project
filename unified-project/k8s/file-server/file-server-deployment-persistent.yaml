apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-server-persistent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: file-server-persistent
  template:
    metadata:
      labels:
        app: file-server-persistent
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: persistent-storage
          mountPath: /usr/share/nginx/html
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: persistent-storage
        persistentVolumeClaim:
          claimName: file-server-pvc
      - name: nginx-config
        configMap:
          name: file-server-nginx-config
          items:
          - key: nginx.conf
            path: nginx.conf
---
apiVersion: v1
kind: Service
metadata:
  name: file-server-persistent-svc
spec:
  type: NodePort
  selector:
    app: file-server-persistent
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
    nodePort: 30002
